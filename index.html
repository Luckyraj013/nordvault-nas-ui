<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAAVI Cloud</title><style>:root{--nav:#091d30;--blue:#286bd6;--bg:#f4f6f8;--ink:#132235;--muted:#66778b;--line:#e0e6ed;--green:#11875d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:232px 1fr}.side{height:100vh;position:sticky;top:0;background:var(--nav);color:#b8c7d6;padding:25px 10px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:14px;padding:0 14px 32px}.logo{display:flex;align-items:end;gap:4px;height:34px}.logo i{width:8px;background:#ff8218;border-radius:2px;transform:skew(-14deg)}.logo i:nth-child(1){height:23px}.logo i:nth-child(2){height:34px}.logo i:nth-child(3){height:27px}.brand b{display:block;color:white;font-size:22px;letter-spacing:.12em}.brand small{font-size:7px;letter-spacing:.28em;color:#8298ad}.label{padding:0 15px 9px;font-size:10px;color:#8096ab}.nav{display:grid;gap:3px}.nav button{height:46px;border:0;border-radius:8px;background:transparent;color:#afc0d1;text-align:left;padding:0 14px;cursor:pointer}.nav button span{display:inline-block;width:34px;color:#86a1b8;font-size:16px}.nav button:hover{background:#102c46}.nav button.active{background:#1c4d78;color:white;box-shadow:inset 3px 0 #4389ef}.foot{margin-top:auto;border-top:1px solid #28445d;padding:22px 14px;color:#849aae;font-size:10px;line-height:1.7}.main{min-width:0}.top{height:68px;background:#0e263b;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.search{height:40px;width:min(540px,48vw);padding:11px 14px;background:#ffffff0e;border:1px solid #ffffff18;border-radius:8px;color:#b9cad8}.profile{display:flex;align-items:center;gap:12px}.role{background:#142f47;color:white;border:1px solid #38516a;border-radius:7px;padding:8px}.avatar{width:38px;height:38px;border-radius:50%;background:#3979dd;display:grid;place-items:center}.profile small{display:block;color:#9fb2c3;font-size:10px}.content{padding:25px 26px 40px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.head h1{margin:0 0 4px;font-size:27px;letter-spacing:-.03em}.head p{margin:0;color:var(--muted);font-size:14px}.btn{height:38px;border:1px solid #cad6e2;border-radius:7px;background:white;color:#245ba9;padding:0 14px;font-weight:600}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:14px}.card{background:white;border:1px solid var(--line);border-radius:11px;box-shadow:0 1px 2px #12243a08,0 8px 24px #12243a08}.stat{padding:20px;display:flex;gap:14px;align-items:center;min-height:105px}.ico{width:50px;height:50px;border-radius:9px;background:#f1f5fa;border:1px solid #e3e9ef;display:grid;place-items:center;color:#286bd6;font-size:18px}.stat label{display:block;color:var(--muted);font-size:11px}.stat b{display:block;font-size:20px;margin:4px 0}.good{color:var(--green)}.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}.panel-title{height:58px;padding:0 15px;display:flex;align-items:center;justify-content:space-between}.panel-title h2{margin:0;font-size:16px}.table{overflow:auto;padding:0 12px 12px}table{width:100%;border-collapse:collapse;white-space:nowrap}th{background:#eef3f8;color:#274360;text-align:left;padding:10px;font-size:10px}td{padding:13px 10px;border-bottom:1px solid #e3e9ef;font-size:11px}.tag{padding:4px 8px;border-radius:5px;background:#e4f4eb;color:#07804b;font-weight:650;font-size:9px}.bar{width:88px;height:6px;background:#e8edf2;border-radius:5px;overflow:hidden;display:inline-block}.bar i{display:block;height:100%;background:#397ce3}.stack{display:grid;gap:12px}.sidecard{padding:15px}.sidecard h2{margin:0 0 14px;font-size:16px}.resource{padding:12px;margin:8px 0;background:#f6f8fa;border:1px solid #e8edf2;border-radius:8px;display:grid;grid-template-columns:1fr auto;gap:6px}.resource .bar{width:100%}.action{display:block;width:100%;height:40px;margin:8px 0;text-align:left;border:1px solid #e1e7ed;border-radius:7px;background:#f7f9fb;color:#245ba9;padding:0 12px}.activity{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.list{padding:0 15px 15px}.row{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid #e5eaf0}.mini{width:31px;height:31px;border-radius:50%;background:#3d7ccf;color:white;display:grid;place-items:center}.row small{display:block;color:var(--muted);font-size:9px}.empty{padding:60px 30px;text-align:center}.empty h2{font-size:22px;margin:0 0 8px}.empty p{color:var(--muted)}@media(max-width:1000px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.sidecard{display:none}}@media(max-width:700px){.app{display:block}.side{height:auto;position:relative;padding:14px}.brand{padding-bottom:14px}.foot,.label{display:none}.nav{display:flex;overflow:auto}.nav button{min-width:120px}.top{padding:0 14px}.search{display:none}.content{padding:18px 14px}.stats{grid-template-columns:1fr}.activity{grid-template-columns:1fr}.profile div:last-child{display:none}}</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo"><i></i><i></i><i></i></div><div><b>MAAVI</b><small>CLOUD · LEARN BUILD GROW</small></div></div><div class="label" id="label">ADMIN CONSOLE</div><nav class="nav" id="nav"></nav><div class="foot"><b style="color:white">MAAVI Cloud</b><br>Secure private storage<br>Version 1.0.0</div></aside><main class="main"><header class="top"><div class="search">Search files, folders and users…</div><div class="profile"><select class="role" id="role"><option value="admin">Admin</option><option value="employee">Employee</option></select><div class="avatar">M</div><div><b id="name">maavi-admin</b><small id="email">admin@maavilearning.com</small></div></div></header><section class="content" id="content"></section></main></div><script>const admin=['Dashboard','Files','Users & Access','Storage','Backup','Activity & Logs','System Settings'],employee=['Dashboard','My Files','Shared','Recent Activity','Profile'],icons=['⌂','□','◎','▱','⟳','▤','⚙'];let role='admin',page='Dashboard';const nav=document.querySelector('#nav'),content=document.querySelector('#content');function renderNav(){let items=role==='admin'?admin:employee;nav.innerHTML=items.map((x,i)=>`<button class="${x===page?'active':''}" onclick="openPage('${x}')"><span>${icons[i]||'□'}</span>${x}</button>`).join('')}function openPage(p){page=p;renderNav();render()}function bar(n){return `<span class="bar"><i style="width:${n}%"></i></span>`}function head(t,d,b=''){return `<div class="head"><div><h1>${t}</h1><p>${d}</p></div>${b}</div>`}function filesTable(title){return `<div class="card"><div class="panel-title"><h2>${title}</h2><button class="btn primary">New</button></div><div class="table"><table><tr><th>NAME</th><th>OWNER</th><th>MODIFIED</th><th>SIZE</th><th>STATUS</th></tr>${[['Projects','Company','Today','—'],['Marketing Plan.pdf','Anjali','Today','8.4 MB'],['Budget Q3.xlsx','Rahul','Yesterday','2.1 MB'],['Meeting Notes.docx','Madhu','8 Sep','1.6 MB'],['Design Assets.fig','Arjun','7 Sep','24 MB']].map(x=>`<tr><td><b>□ ${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td><span class="tag">Synced</span></td></tr>`).join('')}</table></div></div>`}function storageTable(){return `<div class="card"><div class="panel-title"><h2>Storage Devices</h2><button class="btn">View storage</button></div><div class="table"><table><tr><th>DEVICE</th><th>PURPOSE</th><th>CAPACITY</th><th>USED</th><th>FREE</th><th>HEALTH</th><th>STATUS</th></tr>${[['PowerX SSD','Primary','256 GB',71,'74 GB'],['Admin Partition','Admin','151 GiB',61,'58.6 GB'],['Aarvex Linux','System','120 GiB',32,'81.8 GB'],['Backup HDD','Backup','300 GB',41,'176 GB']].map(x=>`<tr><td><b>${x[0]}</b><br><small>/dev/nvme0n1</small></td><td>${x[1]}</td><td>${x[2]}</td><td>${bar(x[3])} ${x[3]}%</td><td>${x[4]}</td><td><span class="good">● Healthy</span></td><td><span class="tag">Mounted</span></td></tr>`).join('')}</table></div></div>`}function rows(){return [['A','Anjali uploaded','Marketing Plan.pdf'],['R','Rahul edited','Budget Q3.xlsx'],['M','Madhu downloaded','Project Notes.zip'],['S','Sneha archived','Old Data']].map(x=>`<div class="row"><div class="mini">${x[0]}</div><div><b>${x[1]}</b><small>${x[2]}</small></div><small>Today</small></div>`).join('')}function dashboard(){if(role==='employee')return head('My Dashboard','Your files, shares and storage in one place.','<button class="btn primary">Upload files</button>')+`<div class="stats">${[['□','My files','1,248','Synced moments ago'],['◎','Shared with me','36','4 new this week'],['▱','Storage','409 GB','of 1 TB used'],['✓','Backup','Secure','Protected continuously']].map(x=>`<div class="card stat"><div class="ico">${x[0]}</div><div><label>${x[1]}</label><b>${x[2]}</b><small>${x[3]}</small></div></div>`).join('')}</div>${filesTable('Recent files')}`;return head('Dashboard','System status, storage, backups and recent activity at a glance.')+`<div class="stats">${[['▤','Server','Online','Uptime 12 days, 6 hours'],['⌘','Remote Access','Connected','Private network active'],['◌','Backup','Healthy','Last backup today'],['◎','Alerts','2','Review required']].map(x=>`<div class="card stat"><div class="ico">${x[0]}</div><div><label>${x[1]}</label><b class="${x[2]!=='2'?'good':''}">${x[2]}</b><small>${x[3]}</small></div></div>`).join('')}</div><div class="grid"><div>${storageTable()}<div class="activity"><div class="card"><div class="panel-title"><h2>Recent Activity</h2><button class="btn">View all</button></div><div class="list">${rows()}</div></div><div class="card"><div class="panel-title"><h2>Backup Summary</h2><span class="tag">ON SCHEDULE</span></div><div class="list">${['Last backup · Today, 02:00','Next backup · Tomorrow, 02:00','Location · Backup HDD','Used space · 124 GB'].map(x=>`<div class="row"><div class="mini">✓</div><b>${x}</b></div>`).join('')}</div></div></div></div><div class="stack"><div class="card sidecard"><h2>System Resources</h2>${[['CPU',18],['Memory',42],['Disk I/O',12],['Network',28]].map(x=>`<div class="resource"><span>${x[0]}</span><small>${x[1]}%</small>${bar(x[1])}</div>`).join('')}</div><div class="card sidecard"><h2>Quick Actions</h2><button class="action">Restart server</button><button class="action">Open system settings</button><button class="action">Review active alerts</button></div></div></div>`}function render(){if(page==='Dashboard')content.innerHTML=dashboard();else if(page==='Files'||page==='My Files'||page==='Shared')content.innerHTML=head(page,'Browse, manage and share files securely.','<button class="btn primary">Upload</button>')+filesTable(page);else if(page==='Storage')content.innerHTML=head('Storage','Manage devices, capacity and health.')+storageTable();else content.innerHTML=head(page,'Manage '+page.toLowerCase()+' for your MAAVI Cloud workspace.')+`<div class="card empty"><h2>${page}</h2><p>This section is ready for your production data and workflows.</p><button class="btn primary">Configure</button></div>`}document.querySelector('#role').onchange=e=>{role=e.target.value;page='Dashboard';document.querySelector('#label').textContent=role==='admin'?'ADMIN CONSOLE':'EMPLOYEE PORTAL';document.querySelector('#name').textContent=role==='admin'?'maavi-admin':'Madhusudhan';document.querySelector('#email').textContent=role==='admin'?'admin@maavilearning.com':'madhusudhanraju270@gmail.com';renderNav();render()};renderNav();render();</script></body></html>
